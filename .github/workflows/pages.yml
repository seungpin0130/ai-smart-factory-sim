name: Factory dashboard
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Dual-AI SK Hynix Fab Simulation']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: factory-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.FACTORY_PAGES_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v5
      - name: Stage public dashboard only
        run: |
          mkdir site
          cp index.html state.json config.json telemetry_history.json dashboard.json site/
          mkdir -p site/web site/logs
          cp web/index.html site/web/
          if [ -f web/replay_history.json ]; then
            cp web/replay_history.json site/web/
          else
            echo '[]' > site/web/replay_history.json
          fi
          cp logs/council_history.md site/logs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
