name: Factory tests
on:
  push:
    paths: ['**.py', 'requirements*.txt', '.github/workflows/**', 'index.html', 'pytest.ini', 'm16_enterprise_v7/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  enterprise-v7:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: m16_enterprise_v7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: m16_enterprise_v7/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests
