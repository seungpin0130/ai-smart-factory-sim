name: Dual-AI Factory Loop
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'mock: API 호출 없음 / live: OpenAI + Gemini'
        type: choice
        options: [mock, live]
        default: mock
      alerts:
        description: '실제 실행에서 장애 Issue 및 댓글 생성·복구 종료'
        type: boolean
        default: true
permissions:
  contents: write
  issues: write
concurrency:
  group: factory-state-writer
  cancel-in-progress: false
jobs:
  cycle:
    if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'workflow_dispatch' || vars.FACTORY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run one cycle
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          COUNCIL_MODE: ${{ inputs.mode || 'live' }}
        run: python run_cycle.py --mode "$COUNCIL_MODE"
      - name: Persist state and council records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json config.json dashboard.json logs/
          if ! git diff --cached --quiet; then
            git commit -m 'factory: persist simulation cycle and council decision'
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - name: Synchronize incident issues
        if: github.event_name == 'schedule' || inputs.alerts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python github_alerts.py
      - name: Dashboard summary
        if: always()
        run: |
          if [ -f logs/last_decision.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('logs/last_decision.json'))
          print(f"### Factory cycle {d['cycle']} · {d['mode']}")
          print(f"Status: {d['state']['status']} / {d['state']['temperature']}°C")
          print(d['action_reason'])
          print(f"Applied: `{d['applied_config']}`")
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-snapshot-${{ github.run_id }}
          path: |
            index.html
            dashboard.json
            logs/last_decision.json
          retention-days: 14
