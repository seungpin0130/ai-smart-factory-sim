services:
  m16-fab-backend:
    build: .
    ports:
      - "127.0.0.1:${M16_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/m16_fab_v7.db}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
