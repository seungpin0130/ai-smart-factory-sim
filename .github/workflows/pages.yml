name: Factory dashboard
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Dual-AI Factory Loop']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: factory-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.FACTORY_PAGES_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v5
      - name: Stage public dashboard only
        run: |
          mkdir site
          cp index.html dashboard.json site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
